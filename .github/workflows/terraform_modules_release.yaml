name: Terraform modules release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'terraform/**'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

jobs:
  terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@cdb412cf82c5b18c0356ed157c1c0fd043860864  # main
    permissions:
      contents: write
    with:
      major-version-file: terraform/charm/MAJOR_VERSION
