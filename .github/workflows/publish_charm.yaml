name: Publish to edge

on:
  push:
    branches:
    - main
    - track/*

jobs:
  select-channel:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      channel: ${{ steps.channel.outputs.name }}
    steps:
      - uses: canonical/charming-actions/channel@2.7.0
        id: channel
  publish-to-edge:
    needs: select-channel
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@14b1cf49d48b9d5b96192d9bca2890c98b7295cf # v1.0.2
    permissions:
      actions: read
      contents: write
    secrets: inherit
    with:
      channel: ${{ needs.select-channel.outputs.channel }}
      integration-workflow-name: integration_test.yaml
