[tool.bandit]
exclude_dirs = ["/venv/"]
[tool.bandit.assert_used]
skips = ["*/*test.py", "*/test_*.py", "*tests/*.py"]

# Testing tools configuration
[tool.coverage.run]
branch = true

# Formatting tools configuration
[tool.black]
line-length = 99
target-version = ["py38"]
exclude = "api/migrations"

[tool.coverage.report]
fail_under = 85
show_missing = true
omit = ["httprequest_lego_provider/httprequest_lego_provider/settings.py"]

# Linting tools configuration
[tool.flake8]
max-line-length = 99
max-doc-length = 99
max-complexity = 10
exclude = [".git", "__pycache__", ".tox", "build", "dist", "*.egg_info", "venv", "httprequest_lego_provider/api/migrations"]
select = ["E", "W", "F", "C", "N", "R", "D", "H"]
# Ignore W503, E501 because using black creates errors with this
# Ignore D107 Missing docstring in __init__
ignore = ["W503", "E501", "D107"]
# D100, D101, D102, D103: Ignore missing docstrings in tests
per-file-ignores = ["tests/*:D100,D101,D102,D103,D104,D205,D212,D415","httprequest_lego_provider/api/tests/*:D100,D101,D102,D103,D104,D205,D212,D415"]
docstring-convention = "google"

[tool.isort]
line_length = 99
profile = "black"
skip = ["api/migrations"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

[tool.pylint]
disable = "wrong-import-order"
ignore = "httprequest_lego_provider/api/migrations"

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.ruff]
line-length = 99
select = ["E", "W", "F", "C", "N", "D", "I001"]
extend-ignore = [
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
ignore = ["E501", "D107"]
extend-exclude = ["__pycache__", "*.egg_info"]
per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"],"httprequest_lego_provider/tests/*" = ["D100","D101","D102","D103","D104"]}

[tool.ruff.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,uv.lock"

[tool.pydocstyle]
match_dir = "match-dir=^(?!httprequest_lego_provider/httprequest_lego_provider/migrations)"

[dependency-groups]
charm = [
    "paas-charm>=2.0b1,<3",
]
fmt = [
    "black",
    "isort",
]
lint = [
    {include-group = "charm"},
    "black",
    "codespell",
    "flake8",
    "flake8-builtins",
    "flake8-copyright<6.0.0",
    "flake8-docstrings>=1.6.0",
    "flake8-docstrings-complete>=1.0.3",
    "flake8-test-docs>=1.0",
    "isort",
    "jubilant",
    "mypy",
    "pep8-naming",
    "pydocstyle>=2.10",
    "pylint",
    "pylint-django",
    "pyproject-flake8",
    "pytest",
    "requests",
    "types-PyYAML",
    "types-requests",
]
unit = [
    {include-group = "charm"},
    "coverage[toml]",
    "pytest",
    "pytest-django",
]
benchmark = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-common",
    "pytest-django",
]
integration = [
    {include-group = "charm"},
    "allure-pytest>=2.8.18",
    "allure-pytest-collection-report @ git+https://github.com/canonical/data-platform-workflows@v24.0.0#subdirectory=python/pytest_plugins/allure_pytest_collection_report",
    "jubilant",
    "opcli @ git+https://github.com/canonical/charm-ci.git@v1.0.1 ; python_version >= '3.12'",
    "pytest",
]
coverage-report = [
    "coverage[toml]",
    "pytest",
]
static = [
    "bandit[toml]",
]
